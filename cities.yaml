# ─────────────────────────────────────────────────────────────────────────────
# NOT THE ACTIVE CONFIG.
#
# The authoritative city configuration lives at:
#
#     pipeline/cities.yaml
#
# Every consumer reads that file and only that file:
#   pipeline/src/download.py, download_od.py, od_matrix.py, od_proxy.py,
#   validate.py, and pipeline/tests/test_pipeline.py
#
# This root-level file used to be a hand-maintained second copy. The two drifted
# apart (Phase 6.8): the root copy declared paris and ahmedabad while the copy
# the pipeline actually loads declared chicago and piedmont, so paris and
# ahmedabad were unreachable by every pipeline stage despite appearing to be
# configured. It is kept as this stub, rather than deleted, so anyone who opens
# the path they remember lands on this pointer instead of stale city data.
#
# To add or edit a city, edit pipeline/cities.yaml.
# ─────────────────────────────────────────────────────────────────────────────
