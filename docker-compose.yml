version: "3.8"

services:
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    container_name: nexussim-engine
    expose:
      - "9001"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    command: ["--city", "chicago", "--duration", "60", "--port", "9001"]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecars
    container_name: nexussim-backend
    ports:
      - "8000:8000"  # Unified Backend Gateway Port
    expose:
      - "9003"
      - "9004"
      - "9005"
      - "9006"
    environment:
      - ENGINE_WS_URL=ws://engine:9001
      - CAMERA_HTTP_URL=http://localhost:9003
      - NLP_HTTP_URL=http://localhost:9004
      - EVENT_BUS_HTTP_URL=http://localhost:9005
      - EVENT_BUS_WS_URL=ws://localhost:9005/ws/events
      - ALGO_HTTP_URL=http://localhost:9006
    depends_on:
      - engine
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: nexussim-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - engine
      - backend
    restart: unless-stopped

networks:
  default:
    name: nexussim-network
