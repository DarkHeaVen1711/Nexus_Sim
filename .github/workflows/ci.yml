name: NexusSim Domain CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-core:
    name: C++ Simulation Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: C++ Configure & Build (Release + Testing)
        run: |
          cd engine
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build . --parallel

      - name: C++ CTest Suite (Agents, Quadtree, Signals, Invariants)
        run: |
          cd engine/build
          ctest --output-on-failure

  data-pipeline:
    name: Urban Data Pipeline & OD Calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Pipeline Dependencies
        run: |
          cd pipeline
          pip install -r requirements.txt

      - name: Pipeline Tests & Mathematical Invariants
        run: |
          cd pipeline
          python -m pytest tests/ -v

  ml-subsystems:
    name: ML, MARL & Soft Computing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install ML Dependencies
        run: |
          cd ml
          pip install -r requirements.txt

      - name: ML Pytest Suite & Pareto Invariants
        run: |
          cd ml
          python -m pytest tests/ -v

  dashboard-ui:
    name: Dashboard UI & Vitest Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Vitest Component & Algorithm Matrix Tests
        run: |
          cd dashboard
          npm run test

      - name: TypeScript Typecheck & Production Build
        run: |
          cd dashboard
          npm run build

  e2e-integration:
    name: Cross-Subject End-to-End Gate
    needs: [engine-core, data-pipeline, ml-subsystems, dashboard-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install Test Dependencies
        run: |
          cd ml
          pip install -r requirements.txt

      - name: Cross-Subject E2E Verification
        run: |
          python -m pytest ml/tests/test_cross_subject_e2e.py -v
