name: NexusSim Domain CI

on:
  # Run on every push to any branch, every PR to any branch, and manually.
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # ------------------------------------------------------------------ CUDA probe
  cuda-probe:
    name: CUDA / GPU Environment Probe
    runs-on: ubuntu-latest
    outputs:
      has_cuda: ${{ steps.probe.outputs.has_cuda }}
      has_onnx_cuda: ${{ steps.probe.outputs.has_onnx_cuda }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install probe dependencies
        run: pip install torch onnxruntime opencv-python-headless numpy

      - name: Probe GPU capabilities
        id: probe
        run: |
          python - <<'EOF'
          import importlib
          import os
          results = {}

          # PyTorch CUDA
          try:
              import torch
              results["torch_cuda"] = str(torch.cuda.is_available()).lower()
          except ImportError:
              results["torch_cuda"] = "false"

          # ONNX Runtime CUDA EP
          try:
              import onnxruntime as ort
              providers = ort.get_available_providers()
              results["onnx_cuda"] = str("CUDAExecutionProvider" in providers).lower()
          except ImportError:
              results["onnx_cuda"] = "false"

          # OpenCV CUDA
          try:
              import cv2
              if hasattr(cv2, "cuda"):
                  results["opencv_cuda"] = str(cv2.cuda.getCudaEnabledDeviceCount() > 0).lower()
              else:
                  results["opencv_cuda"] = "false"
          except ImportError:
              results["opencv_cuda"] = "false"

          print(f"torch_cuda={results['torch_cuda']}")
          print(f"onnx_cuda={results['onnx_cuda']}")
          print(f"opencv_cuda={results['opencv_cuda']}")

          # GitHub Actions ubuntu-latest has no NVIDIA GPU
          has_cuda = "true" if results["torch_cuda"] == "true" else "false"
          has_onnx_cuda = "true" if results["onnx_cuda"] == "true" else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_cuda={has_cuda}\n")
              f.write(f"has_onnx_cuda={has_onnx_cuda}\n")
          EOF

  # ------------------------------------------------------------------ C++ engine
  engine-core:
    name: C++ Simulation Engine
    needs: cuda-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: C++ Configure & Build (Release + Testing)
        run: |
          cd engine
          mkdir -p build && cd build
          # ONNX CUDA auto-mode: CMakeLists.txt tries GPU package, falls back to CPU
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_ONNX_CUDA=AUTO
          cmake --build . --parallel

      - name: C++ CTest Suite (Agents, Quadtree, Signals, Invariants)
        run: |
          cd engine/build
          ctest --output-on-failure

      - name: Report ONNX CUDA status
        run: |
          cd engine/build
          ./bench_inference --provider auto 2>&1 || true

  # ------------------------------------------------------------- data pipeline
  data-pipeline:
    name: Urban Data Pipeline & OD Calibration
    needs: cuda-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gdal-bin libgdal-dev libspatialindex-dev libgeos-dev \
            python3-dev pkg-config

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Pipeline Dependencies
        run: |
          cd pipeline
          pip install -r requirements.txt

      - name: Pipeline Tests & Mathematical Invariants
        run: |
          cd pipeline
          python -m pytest tests/ -v

  # ------------------------------------------------------------------- ML suite
  ml-subsystems:
    name: ML, MARL & Soft Computing
    needs: cuda-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1 \
            libgomp1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install ML Dependencies
        run: |
          cd ml
          pip install -r requirements.txt

      - name: ML Pytest Suite & Pareto Invariants
        run: |
          cd ml
          python -m pytest tests/ -v

  # ----------------------------------------------------------------- dashboard
  dashboard-ui:
    name: Dashboard UI & Vitest Harness
    needs: cuda-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Vitest Component & Algorithm Matrix Tests
        run: |
          cd dashboard
          npm run test

      - name: TypeScript Typecheck & Production Build
        run: |
          cd dashboard
          npm run build

  # ------------------------------------------------------- gateway (offline)
  gateway-api:
    name: Gateway API (Offline TestClient)
    needs: cuda-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Gateway Dependencies
        run: pip install pyyaml osmnx pytest httpx fastapi uvicorn python-multipart python-jose[cryptography] websockets networkx requests

      - name: Gateway TestClient Suite (offline, no live server required)
        run: python -m pytest gateway/ -v

  # ------------------------------------------- postman / api_check verification
  api-verification:
    name: Postman / api_check Full-Stack Verification
    needs: [engine-core, data-pipeline, ml-subsystems, dashboard-ui, gateway-api, cuda-probe]
    runs-on: ubuntu-latest
    continue-on-error: true
    # Exercises the live stack (engine WS :9001, gateway :8000,
    # sidecars :9003-:9006, dashboard :3000).
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1 \
            libgomp1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install API Check Dependencies
        run: |
          cd ml && pip install -r requirements.txt
          pip install requests websocket-client fastapi uvicorn python-multipart python-jose[cryptography] opencv-python-headless networkx pytest pyyaml osmnx

      - name: Install Node.js for dashboard preview
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Dashboard Static Assets
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Build C++ Engine (for WS checks)
        run: |
          cd engine
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON -DENABLE_ONNX_CUDA=AUTO
          cmake --build . --parallel

      - name: Start Python Services (gateway + sidecars)
        run: |
          cd "$GITHUB_WORKSPACE"
          nohup python -m gateway.server > /tmp/gateway.log 2>&1 &
          nohup python ml/nlp/chat_service.py > /tmp/chat.log 2>&1 &
          nohup python ml/cv/virtual_camera_service.py > /tmp/camera.log 2>&1 &
          sleep 8
          echo "--- gateway log tail ---"; tail -n 5 /tmp/gateway.log || true
          echo "--- chat log tail ---"; tail -n 5 /tmp/chat.log || true
          echo "--- camera log tail ---"; tail -n 5 /tmp/camera.log || true

      - name: Start C++ Engine (WS :9001)
        run: |
          cd "$GITHUB_WORKSPACE/engine"
          nohup ./build/engine --city piedmont --agents 100 --onnx-provider auto > /tmp/engine.log 2>&1 &
          sleep 4
          echo "--- engine log tail ---"; tail -n 5 /tmp/engine.log || true

      - name: Start Dashboard Preview (:3000)
        run: |
          cd "$GITHUB_WORKSPACE/dashboard"
          nohup npx preview --port 3000 > /tmp/dashboard.log 2>&1 &
          sleep 6
          echo "--- dashboard log tail ---"; tail -n 5 /tmp/dashboard.log || true

      - name: Run api_check.py Full-Stack Verification
        env:
          NEXUSSIM_GATEWAY_URL: https://127.0.0.1:8000
          NEXUSSIM_CAMERA_URL: https://127.0.0.1:9003
          NEXUSSIM_NLP_URL: https://127.0.0.1:9004
          NEXUSSIM_EVENT_BUS_URL: https://127.0.0.1:9005
          NEXUSSIM_ALGO_URL: https://127.0.0.1:9006
          NEXUSSIM_DASHBOARD_URL: https://127.0.0.1:3000
          NEXUSSIM_ENGINE_WS_URL: wss://127.0.0.1:9001
        run: python postman/api_check.py

      - name: Upload API Check Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-check-results
          path: postman/results/api_check-*.{json,md}
          retention-days: 7

  # ---------------------------------------------------- GPU job (self-hosted)
  gpu-inference:
    name: GPU Inference Verification (self-hosted)
    needs: cuda-probe
    if: needs.cuda-probe.outputs.has_onnx_cuda == 'true'
    runs-on: self-hosted
    continue-on-error: true
    # Only runs on self-hosted runners that have an NVIDIA GPU with
    # CUDA-enabled ONNX Runtime. Validates end-to-end GPU inference.
    steps:
      - uses: actions/checkout@v4

      - name: Verify GPU detected
        run: |
          nvidia-smi || echo "nvidia-smi not available"
          python -c "import torch; print('Torch CUDA:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"
          python -c "import onnxruntime as ort; print('ORT providers:', ort.get_available_providers())"

      - name: Build engine with CUDA ONNX
        run: |
          cd engine
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON -DENABLE_ONNX_CUDA=ON
          cmake --build . --parallel

      - name: Run ONNX inference benchmark with CUDA EP
        run: |
          cd engine/build
          ./bench_inference --provider cuda 2>&1 || echo "CUDA EP benchmark failed (fallback to CPU expected if CUDA runtime missing)"

      - name: Run engine with --onnx-provider cuda
        run: |
          cd engine/build
          timeout 30 ./engine --city piedmont --agents 100 --onnx-provider cuda --fast --no-ws 2>&1 || true

  # ---------------------------------------------------- Windows build validation
  windows-build:
    name: Windows Build Validation (documented path)
    needs: cuda-probe
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check Windows Build Prerequisites
        run: |
          Write-Host "=== cmake ==="; cmake --version | Select-Object -First 1
          Write-Host "=== python ==="; python --version
          Write-Host "=== node ==="; node --version; npm --version
          $make = Get-Command make -ErrorAction SilentlyContinue
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          Write-Host "make present:  $($null -ne $make)"
          Write-Host "ninja present: $($null -ne $ninja)"
          Write-Host "openssl present: $($null -ne $openssl)"
          if (-not ($make -and $ninja -and $openssl)) {
            Write-Host "WARNING: Windows build prerequisites incomplete (make/ninja/openssl missing)."
            Write-Host "Use 'cmake -G \"MinGW Makefiles\"' instead of 'make build'. See README.md Build notes."
            exit 0
          }
          Write-Host "All Windows build prerequisites present."
