chicago:
  chaos: 0.1
  cv_bbox:
  - 41.83
  - -87.75
  - 41.92
  - -87.6
  od_source:
    dataset: m6dm-c72p
    default_month: 10
    default_year: 2019
    destination_column: dropoff_community_area
    note: Uber/Lyft Transportation Network Provider trips published by the City of
      Chicago open-data portal (2018-2022). Same underlying rideshare data that Uber
      Movement was built on. Uber Movement itself was decommissioned in 2023.
    origin_column: pickup_community_area
    timestamp_column: trip_start_timestamp
    trip_seconds_column: trip_seconds
    type: socrata
    zone_column: area_numbe
    zone_geometry_column: the_geom
    zone_name_column: community
    zone_type: community-area
    zones_dataset: igwz-8jzy
  query: Chicago, Illinois, USA
